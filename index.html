<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terabox Player API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h2>Terabox Video Player</h2>

  <input type="text" id="videoUrl" placeholder="Paste Terabox link here">

  <br>

  <button onclick="loadVideo()">Load Video</button>

  <br>

  <video id="videoPlayer" controls></video>

  <br>

  <!-- 🔥 SHARE BUTTON -->
  <button onclick="shareVideo()">Share Embed Link</button>

  <!-- 🔥 COPY EMBED CODE BUTTON -->
  <button onclick="copyEmbedCode()">Copy Embed Code</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="script.js"></script>

</body>
</html>
