<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TeraBox API Tool</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  margin-bottom: 10px;
}

button {
  padding: 10px;
  border: none;
  border-radius: 8px;
  margin: 5px 0;
  width: 100%;
  cursor: pointer;
}

.run {
  background: #22c55e;
  color: white;
}

.copy {
  background: #3b82f6;
  color: white;
}

.result {
  margin-top: 20px;
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
}

.link-box {
  margin-top: 10px;
  padding: 10px;
  background: #334155;
  border-radius: 8px;
  word-break: break-all;
}
</style>

</head>

<body>

<div class="container">

<h2>TeraBox Link Extractor</h2>

<input id="urlInput" placeholder="Paste TeraBox link here...">

<button class="run" onclick="runAPI()">RUN</button>

<div id="output" class="result"></div>

</div>

<script>
async function runAPI() {
  const url = document.getElementById("urlInput").value;
  const output = document.getElementById("output");

  output.innerHTML = "Loading...";

  try {
    const response = await fetch('https://xapiverse.com/api/terabox', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'xAPIverse-Key': 'sk_9426e8f42e6b15560945f64bb1158418'
      },
      body: JSON.stringify({ url: url })
    });

    const data = await response.json();

    if (data.status !== "success") {
      output.innerHTML = "Error fetching data";
      return;
    }

    let html = "";

    data.list.forEach(item => {

      const stream360 = item.fast_stream_url?.["360p"] || "";
      const stream480 = item.fast_stream_url?.["480p"] || "";
      const stream720 = item.fast_stream_url?.["720p"] || "";

      html += `
        <h3>${item.name}</h3>
        <p>Size: ${item.size_formatted}</p>
        <p>Quality: ${item.quality}</p>

        <div class="link-box">
          Normal Link:<br>${item.normal_dlink}
          <button class="copy" onclick="copyText('${item.normal_dlink}')">Copy</button>
        </div>

        ${stream720 ? `
        <div class="link-box">
          Fast Stream 720p:<br>${stream720}
          <button class="copy" onclick="copyText('${stream720}')">Copy</button>
        </div>` : ""}

        ${stream480 ? `
        <div class="link-box">
          Fast Stream 480p:<br>${stream480}
          <button class="copy" onclick="copyText('${stream480}')">Copy</button>
        </div>` : ""}

        ${stream360 ? `
        <div class="link-box">
          Fast Stream 360p:<br>${stream360}
          <button class="copy" onclick="copyText('${stream360}')">Copy</button>
        </div>` : ""}

        <div class="link-box">
          Subtitle:<br>${item.subtitle_url || "N/A"}
          <button class="copy" onclick="copyText('${item.subtitle_url || ""}')">Copy</button>
        </div>

        <hr>
      `;
    });

    output.innerHTML = html;

  } catch (err) {
    output.innerHTML = "Request failed!";
  }
}

function copyText(text) {
  if (!text) return alert("No link available");
  navigator.clipboard.writeText(text);
  alert("Copied!");
}
</script>

</body>
</html>
