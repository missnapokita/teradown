<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  overflow: hidden;
}

.container {
  position: fixed;
  width: 100%;
  height: 100%;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

/* overlay */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 60%);
}

/* TOP BAR */
.top {
  position: absolute;
  top: 0;
  width: 100%;
  padding: 10px;
  display: flex;
  align-items: center;
}

.top button {
  font-size: 18px;
}

.title {
  margin-left: 10px;
  font-weight: bold;
}

/* CENTER CONTROLS */
.center {
  position: absolute;
  top: 50%;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 40px;
  transform: translateY(-50%);
}

.center button {
  font-size: 30px;
}

/* BOTTOM */
.bottom {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 10px;
}

/* progress */
.progress-container {
  display: flex;
  align-items: center;
}

.time {
  font-size: 12px;
  width: 60px;
  text-align: center;
}

input[type=range] {
  flex: 1;
}

/* bottom actions */
.actions {
  display: flex;
  justify-content: space-around;
  margin-top: 10px;
}

.actions div {
  text-align: center;
  font-size: 12px;
}

button {
  background: rgba(0,0,0,0.6);
  border: none;
  color: white;
  padding: 10px;
  border-radius: 50%;
}
</style>

</head>

<body>

<div class="container">

<video id="video"></video>

<div class="overlay"></div>

<!-- TOP -->
<div class="top">
  <button onclick="goBack()">←</button>
  <div class="title" id="title">Playing Video</div>
</div>

<!-- CENTER -->
<div class="center">
  <button onclick="rewind()">⏪</button>
  <button onclick="togglePlay()">▶</button>
  <button onclick="forward()">⏩</button>
</div>

<!-- BOTTOM -->
<div class="bottom">

  <div class="progress-container">
    <div class="time" id="current">00:00</div>
    <input type="range" id="progress">
    <div class="time" id="duration">00:00</div>
  </div>

  <div class="actions">
    <div onclick="toggleFullscreen()">⛶<br>Screen</div>
    <div onclick="toggleFit()">📺<br>Resize</div>
    <div onclick="alert('Subtitle soon')">💬<br>Sub</div>
    <div onclick="alert('Next soon')">⏭<br>Next</div>
  </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const video = document.getElementById("video");
const progress = document.getElementById("progress");
const current = document.getElementById("current");
const duration = document.getElementById("duration");

const params = new URLSearchParams(window.location.search);
const q360 = params.get("q360");
const q480 = params.get("q480");
const q720 = params.get("q720");

const src = q720 || q480 || q360;

// load
if (Hls.isSupported()) {
  const hls = new Hls();
  hls.loadSource(src);
  hls.attachMedia(video);
} else {
  video.src = src;
}

video.onloadedmetadata = () => {
  video.play();
  duration.innerText = format(video.duration);
};

video.ontimeupdate = () => {
  progress.value = (video.currentTime / video.duration) * 100;
  current.innerText = format(video.currentTime);
};

progress.oninput = () => {
  video.currentTime = (progress.value / 100) * video.duration;
};

// controls
function togglePlay() {
  video.paused ? video.play() : video.pause();
}

function rewind() { video.currentTime -= 10; }
function forward() { video.currentTime += 10; }

// fullscreen
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// resize toggle
let fit = true;
function toggleFit() {
  fit = !fit;
  video.style.objectFit = fit ? "contain" : "cover";
}

// back
function goBack() {
  history.back();
}

// time format
function format(sec) {
  let m = Math.floor(sec / 60);
  let s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? "0"+s : s}`;
}
</script>

</body>
</html>
