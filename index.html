<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeraBox Tool</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

/* container */
.container {
  padding: 15px;
}

/* title */
h2 {
  text-align: center;
  margin-bottom: 15px;
}

/* input */
input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  margin-bottom: 10px;
  font-size: 14px;
}

/* buttons */
button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  margin-top: 8px;
  font-size: 15px;
}

.run {
  background: #22c55e;
}

.copy {
  background: #3b82f6;
}

.play {
  background: #f59e0b;
  color: black;
}

/* card result */
.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-top: 15px;
}

/* link box */
.link-box {
  background: #334155;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
  font-size: 12px;
  word-break: break-all;
}

/* label */
.label {
  font-size: 12px;
  opacity: 0.7;
}
</style>

</head>

<body>

<div class="container">

<h2>TeraBox Extractor</h2>

<input id="urlInput" placeholder="Paste TeraBox link...">

<button class="run" onclick="runAPI()">RUN</button>

<div id="output"></div>

</div>

<script>
async function runAPI() {
  const url = document.getElementById("urlInput").value;
  const output = document.getElementById("output");

  output.innerHTML = "Loading...";

  try {
    const response = await fetch('https://xapiverse.com/api/terabox', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'xAPIverse-Key': 'sk_9426e8f42e6b15560945f64bb1158418'
      },
      body: JSON.stringify({ url: url })
    });

    const data = await response.json();

    if (data.status !== "success") {
      output.innerHTML = "Error fetching data";
      return;
    }

    let html = "";

    data.list.forEach(item => {

      const stream360 = item.fast_stream_url?.["360p"] || "";
      const stream480 = item.fast_stream_url?.["480p"] || "";
      const stream720 = item.fast_stream_url?.["720p"] || "";

      html += `
      <div class="card">
        <h3>${item.name}</h3>
        <div class="label">Size: ${item.size_formatted}</div>

        <div class="link-box">
          <b>Download:</b><br>${item.normal_dlink}
          <button class="copy" onclick="copyText('${item.normal_dlink}')">Copy</button>
        </div>

        ${stream720 ? `
        <div class="link-box">
          <b>720p</b><br>${stream720}
          <button class="copy" onclick="copyText('${stream720}')">Copy</button>
        </div>` : ""}

        ${stream480 ? `
        <div class="link-box">
          <b>480p</b><br>${stream480}
          <button class="copy" onclick="copyText('${stream480}')">Copy</button>
        </div>` : ""}

        ${stream360 ? `
        <div class="link-box">
          <b>360p</b><br>${stream360}
          <button class="copy" onclick="copyText('${stream360}')">Copy</button>
        </div>` : ""}

        <button class="play" onclick="playVideo('${stream360}','${stream480}','${stream720}')">
          ▶ Watch Now
        </button>

      </div>
      `;
    });

    output.innerHTML = html;

  } catch (err) {
    output.innerHTML = "Request failed!";
  }
}

function copyText(text) {
  if (!text) return alert("No link");
  navigator.clipboard.writeText(text);
  alert("Copied!");
}

// player open
function playVideo(q360, q480, q720) {
  window.open(
    "player.html?q360=" + encodeURIComponent(q360 || "") +
    "&q480=" + encodeURIComponent(q480 || "") +
    "&q720=" + encodeURIComponent(q720 || ""),
    "_blank"
  );
}
</script>

</body>
</html>
