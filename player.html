<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Player</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  overflow: hidden;
}

/* container */
.video-container {
  position: fixed;
  width: 100%;
  height: 100%;
}

/* video */
video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

/* overlay */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(to top, rgba(0,0,0,0.9), transparent 60%);
  pointer-events: none;
}

/* center button */
.center-play {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-size: 70px;
  background: rgba(0,0,0,0.6);
  padding: 25px;
  border-radius: 50%;
}

/* controls */
.controls {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 15px;
}

/* progress */
.progress {
  width: 100%;
  height: 4px;
}

/* buttons */
.buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
}

.left, .right {
  display: flex;
  gap: 10px;
}

button {
  background: rgba(0,0,0,0.7);
  border: none;
  color: white;
  padding: 14px;
  border-radius: 50%;
  font-size: 18px;
}

/* top bar */
.topbar {
  position: absolute;
  top: 0;
  width: 100%;
  padding: 10px;
  display: flex;
  justify-content: space-between;
}

.quality {
  background: rgba(0,0,0,0.7);
  color: white;
  border-radius: 6px;
  padding: 5px;
}
</style>

</head>

<body>

<div class="video-container">

<video id="video"></video>

<div class="overlay"></div>

<div id="centerPlay" class="center-play">▶</div>

<!-- TOP BAR -->
<div class="topbar">
  <button onclick="goBack()">←</button>
  <select id="qualitySelect" class="quality"></select>
</div>

<!-- CONTROLS -->
<div class="controls">
  <input type="range" id="progress" class="progress">

  <div class="buttons">
    <div class="left">
      <button onclick="rewind()">⏪</button>
      <button onclick="togglePlay()">⏯</button>
      <button onclick="forward()">⏩</button>
    </div>

    <div class="right">
      <button onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const video = document.getElementById('video');
const progress = document.getElementById('progress');
const centerPlay = document.getElementById('centerPlay');
const qualitySelect = document.getElementById('qualitySelect');

const params = new URLSearchParams(window.location.search);

// GET ALL QUALITIES
const q360 = params.get("q360");
const q480 = params.get("q480");
const q720 = params.get("q720");

// default
let currentSrc = q720 || q480 || q360;

// populate dropdown
if (q720) qualitySelect.innerHTML += `<option value="${q720}">720p</option>`;
if (q480) qualitySelect.innerHTML += `<option value="${q480}">480p</option>`;
if (q360) qualitySelect.innerHTML += `<option value="${q360}">360p</option>`;

// change quality
qualitySelect.onchange = () => loadVideo(qualitySelect.value);

// load video
function loadVideo(src) {
  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(src);
    hls.attachMedia(video);
  } else {
    video.src = src;
  }
}

loadVideo(currentSrc);

// autoplay
video.addEventListener("loadedmetadata", () => video.play());

// controls
function togglePlay() {
  video.paused ? video.play() : video.pause();
}

function rewind() { video.currentTime -= 10; }
function forward() { video.currentTime += 10; }

video.ontimeupdate = () => {
  if (video.duration) {
    progress.value = (video.currentTime / video.duration) * 100;
  }
};

progress.oninput = () => {
  video.currentTime = (progress.value / 100) * video.duration;
};

// fullscreen
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// center play
centerPlay.onclick = togglePlay;
video.onplay = () => centerPlay.style.display = "none";
video.onpause = () => centerPlay.style.display = "block";

// back
function goBack() {
  history.back();
}

/* 🔥 GESTURES */

// swipe seek
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;
  let diff = endX - startX;

  if (diff > 50) rewind();
  if (diff < -50) forward();
});
</script>

</body>
</html>
