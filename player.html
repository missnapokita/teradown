<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video Player</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  overflow: hidden;
}

/* container full mobile */
.video-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
}

/* video fix (no zoom) */
video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

/* gradient */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 50%);
  pointer-events: none;
}

/* center play */
.center-play {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 60px;
  background: rgba(0,0,0,0.6);
  border-radius: 50%;
  padding: 25px;
  cursor: pointer;
}

/* controls */
.controls {
  position: absolute;
  bottom: 10px;
  width: 100%;
  padding: 10px;
  box-sizing: border-box;
}

/* progress */
.progress {
  width: 100%;
  height: 5px;
}

/* buttons */
.buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
}

button {
  background: rgba(0,0,0,0.7);
  border: none;
  color: white;
  padding: 14px;
  border-radius: 50%;
  font-size: 18px;
}
</style>

</head>

<body>

<div class="video-container">

<video id="video"></video>

<div class="overlay"></div>

<div id="centerPlay" class="center-play">▶</div>

<div class="controls">
  <input type="range" id="progress" class="progress" value="0">

  <div class="buttons">
    <div>
      <button onclick="togglePlay()">⏯</button>
      <button onclick="rewind()">⏪</button>
      <button onclick="forward()">⏩</button>
    </div>
    <div>
      <button onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const video = document.getElementById('video');
const progress = document.getElementById('progress');
const centerPlay = document.getElementById('centerPlay');

// get URL
const params = new URLSearchParams(window.location.search);
const videoSrc = params.get("url");

if (!videoSrc) {
  alert("No video URL");
}

// HLS
if (Hls.isSupported()) {
  const hls = new Hls();
  hls.loadSource(videoSrc);
  hls.attachMedia(video);
} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = videoSrc;
}

// autoplay
video.addEventListener("loadedmetadata", () => {
  video.play();
});

// play toggle
centerPlay.onclick = togglePlay;

function togglePlay() {
  if (video.paused) {
    video.play();
    centerPlay.style.display = "none";
  } else {
    video.pause();
    centerPlay.style.display = "block";
  }
}

// progress update
video.ontimeupdate = () => {
  if (video.duration) {
    progress.value = (video.currentTime / video.duration) * 100;
  }
};

// seek
progress.oninput = () => {
  if (video.duration) {
    video.currentTime = (progress.value / 100) * video.duration;
  }
};

// skip
function rewind() {
  video.currentTime -= 10;
}

function forward() {
  video.currentTime += 10;
}

// fullscreen (mobile friendly)
function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// icon toggle
video.onplay = () => centerPlay.style.display = "none";
video.onpause = () => centerPlay.style.display = "block";
</script>

</body>
</html>
